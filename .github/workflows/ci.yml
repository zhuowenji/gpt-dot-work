name: Verify source
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      # No npm install: both packages currently have no npm dependencies.
      - name: Frontend syntax, Node tests, and static build
        run: npm run check
      - name: Backend syntax and tests
        run: npm --prefix backend run check
      # Browser smoke tests require separately provisioned Python Playwright/Chromium.
      # This workflow does not publish, deploy, upload artifacts, or use application secrets.
